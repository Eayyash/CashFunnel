<html lang="en"><head>

<title>Tasheel · Application Cost</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fa;--bg2:#eef1f6;--card:#fff;
  --text:#1a1d2e;--muted:#6b7280;--faint:#d1d5db;
  --border:#e5e7eb;--border2:#d1d5db;
  --accent:#4f46e5;--accent2:#6366f1;--accent-soft:rgba(79,70,229,.08);
  --green:#059669;--green-bg:#ecfdf5;--green-border:#a7f3d0;
  --red:#dc2626;--red-bg:#fef2f2;--red-border:#fecaca;
  --orange:#d97706;--orange-bg:#fffbeb;--orange-border:#fde68a;
  --blue:#2563eb;--blue-bg:#eff6ff;
  --r:12px;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 4px 16px rgba(0,0,0,.07),0 2px 6px rgba(0,0,0,.04)
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}

header{background:#fff;border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.04)}
header .brand{display:flex;align-items:center;gap:12px}
header .logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px;letter-spacing:.03em}
header .t{font-weight:700;font-size:1.05rem;color:var(--text);letter-spacing:-.01em}
header .s{font-size:.7rem;color:var(--muted)}
.spacer{flex:1}
.btn{padding:7px 16px;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text);transition:all .15s;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.ghost{background:transparent}
.chip{font-size:.7rem;color:var(--muted);padding:5px 14px;border:1px solid var(--border);border-radius:20px;font-family:'JetBrains Mono',monospace;background:var(--bg2)}
.wrap{max-width:1260px;margin:0 auto;padding:24px 28px 80px}

.filter-bar{display:flex;gap:14px;align-items:center;margin-bottom:20px;padding:12px 20px;background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);flex-wrap:wrap}
.filter-bar .filter-label{font-size:.66rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.8px}
.filter-bar label{font-size:.78rem;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.filter-bar input[type=date]{padding:6px 12px;border:1px solid var(--border);border-radius:7px;font-family:'JetBrains Mono',monospace;font-size:.78rem;background:#fff;color:var(--text);outline:none;transition:border-color .15s}
.filter-bar input[type=date]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.filter-bar .reset{font-size:.75rem;color:var(--accent);cursor:pointer;padding:5px 14px;border:1px solid var(--border);border-radius:7px;transition:all .15s;background:#fff;font-weight:600}
.filter-bar .reset:hover{background:var(--accent-soft);border-color:var(--accent)}
.filter-bar .range-info{font-size:.72rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-left:auto}

.kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:28px}
@media(max-width:1060px){.kpi-strip{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}}
.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:box-shadow .2s,transform .2s}
.kpi:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.kpi::before{content:"";position:absolute;top:0;left:0;width:4px;bottom:0;border-radius:4px 0 0 4px}
.kpi.k1::before{background:var(--accent)}
.kpi.k2::before{background:var(--blue)}
.kpi.k3::before{background:var(--green)}
.kpi.k4::before{background:var(--orange)}
.kpi.k5::before{background:var(--red)}
.kpi .label{font-size:.64rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin-bottom:8px}
.kpi .val{font-family:'DM Sans',sans-serif;font-size:1.55rem;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.kpi .sub{font-size:.7rem;color:var(--muted);margin-top:6px}

.section{margin-bottom:32px}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.section-head h2{font-size:1.05rem;font-weight:700;color:var(--text)}
.section-head .badge{font-size:.68rem;font-weight:700;padding:4px 14px;border-radius:20px;letter-spacing:.2px}
.badge.booked{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.badge.notbooked{background:var(--orange-bg);color:var(--orange);border:1px solid var(--orange-border)}

.panel{background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-bottom:1px solid var(--border)}
@media(max-width:700px){.summary-grid{grid-template-columns:repeat(2,1fr)}}
.summary-item{text-align:center;padding:20px 16px;border-right:1px solid var(--border)}
.summary-item:last-child{border-right:none}
.summary-item .num{font-family:'DM Sans',sans-serif;font-size:1.3rem;font-weight:700;color:var(--text)}
.summary-item .lbl{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:5px;font-weight:700}

table{width:100%;border-collapse:collapse;font-size:.82rem}
th{text-align:left;padding:10px 16px;font-size:.62rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--border);background:var(--bg2)}
td{padding:10px 16px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--accent-soft)}
.right{text-align:right}
.mono{font-family:'JetBrains Mono',monospace;font-size:.76rem;color:#374151}
.totrow td{font-weight:700;border-top:2px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.note{font-size:.7rem;color:var(--muted);padding:12px 18px;border-top:1px solid var(--border);background:var(--bg2)}

.cost-rates{margin-bottom:24px}
.cost-rates summary{cursor:pointer;font-size:.82rem;font-weight:600;color:var(--muted);padding:12px 0;transition:color .15s}
.cost-rates summary:hover{color:var(--accent)}
.cost-rates table{margin-top:8px}
</style>
</head><body>

const NAFITH={above50k:69,below50k:35};

function fmt(n){return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtI(n){return n.toLocaleString('en-US');}
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return d.toISOString().slice(0,10);}

function aggregate(from,to){
  const agg={
    booked:{local:{count:0,nafith69:0,nafith35:0,totalVal:0},expat:{count:0,nafith69:0,nafith35:0,totalVal:0}},
    notBooked:{local:{count:0},expat:{count:0}},
    total:0
  };
  COST_DATA.dates.forEach(d=>{
    if(from&&d<from) return;
    if(to&&d>to) return;
    const day=COST_DATA.days[d];
    if(!day) return;
    agg.booked.local.count+=day.bl; agg.booked.local.nafith69+=day.bn69;
    agg.booked.local.nafith35+=day.bn35; agg.booked.local.totalVal+=day.bv;
    agg.booked.expat.count+=day.be; agg.booked.expat.nafith69+=day.be69;
    agg.booked.expat.nafith35+=day.be35; agg.booked.expat.totalVal+=day.bev;
    agg.notBooked.local.count+=day.nl; agg.notBooked.expat.count+=day.ne;
    agg.total+=day.bl+day.be+day.nl+day.ne;
  });
  return agg;
}

function buildTable(isBooked,localCount,expatCount,nafith69,nafith35){
  let html='<table><thead><tr><th>Service</th><th class="right">Unit Cost (SAR)</th><th class="right">Local Calls</th><th class="right">Expat Calls</th><th class="right">Total Cost (SAR)</th></tr></thead><tbody>';
  let grand=0;
  SERVICES.forEach(s=>{
    const lc=s.expatOnly?0:localCount;
    const ec=s.localOnly?0:expatCount;
    const line=s.cost*(lc+ec);
    grand+=line;
    html+=`<tr><td>${s.name}</td><td class="right mono">${fmt(s.cost)}</td><td class="right mono">${s.expatOnly?'—':fmtI(lc)}</td><td class="right mono">${s.localOnly?'—':fmtI(ec)}</td><td class="right mono">${fmt(line)}</td></tr>`;
  });
  if(isBooked){
    const n69=NAFITH.above50k*(nafith69||0);
    const n35=NAFITH.below50k*(nafith35||0);
    grand+=n69+n35;
    html+=`<tr><td>Nafith (≥ 50,000 SAR)</td><td class="right mono">${fmt(NAFITH.above50k)}</td><td class="right mono" colspan="2" style="text-align:center">${fmtI(nafith69||0)} apps</td><td class="right mono">${fmt(n69)}</td></tr>`;
    html+=`<tr><td>Nafith (< 50,000 SAR)</td><td class="right mono">${fmt(NAFITH.below50k)}</td><td class="right mono" colspan="2" style="text-align:center">${fmtI(nafith35||0)} apps</td><td class="right mono">${fmt(n35)}</td></tr>`;
  }
  html+=`<tr class="totrow"><td colspan="4">Total Cost</td><td class="right mono">${fmt(grand)}</td></tr></tbody></table>`;
  return {html,grand};
}

function render(from,to){

    <div class="kpi k4"><div class="label">Avg Cost / Not-Booked App</div><div class="val">SAR ${fmt(avgNB)}</div><div class="sub">${fmtI(totalNotBooked)} not-booked applications</div></div>

      </div>

      <div class="note">Nafith: SAR 69 if booked amount ≥ 50,000 · SAR 35 if < 50,000. KYC Absher has no listed cost. Local = CivilID starts with 1.</div>

  </div>

  <div class="section">

    <div class="panel">
      <div class="summary-grid">
        <div class="summary-item"><div class="num">${fmtI(nL.count)}</div><div class="lbl">Local (Saudi)</div></div>
        <div class="summary-item"><div class="num">${fmtI(nE.count)}</div><div class="lbl">Expat</div></div>
        <div class="summary-item"><div class="num">SAR ${fmt(nbTable.grand)}</div><div class="lbl">Total API Cost</div></div>
        <div class="summary-item"><div class="num">SAR ${fmt(avgNB)}</div><div class="lbl">Avg per App</div></div>
      </div>
      ${nbTable.html}
      <div class="note">Not-booked applications do not incur Nafith (e-promissory note) costs. All other API services are assumed called per application.</div>

  </div>

  <div class="cost-rates">

(function init(){
  const M=COST_DATA.meta;
  document.getElementById('data-chip').textContent=
    M.fileName? `${M.fileName} · ${M.min} → ${M.max}` : 'No data — run update script';

  if(!M.total||!COST_DATA.dates.length){
    document.getElementById('content').innerHTML='<div style="text-align:center;padding:80px 20px;color:var(--muted)"><div style="font-size:2.5rem;margin-bottom:12px;opacity:.4">📊</div><p style="font-size:.9rem">No cost data yet. Run the Acquisition dashboard update script to populate.</p></div>';

  }

  document.getElementById('filter-bar').style.display='flex';
  const fromEl=document.getElementById('date-from');
  const toEl=document.getElementById('date-to');
  fromEl.min=M.min; fromEl.max=M.max;
  toEl.min=M.min; toEl.max=M.max;

  const yd=yesterday();
  const defaultDate=yd<=M.max?yd:M.max;
  fromEl.value=defaultDate;
  toEl.value=defaultDate;

  fromEl.addEventListener('change',()=>render(fromEl.value,toEl.value));
  toEl.addEventListener('change',()=>render(fromEl.value,toEl.value));
  document.getElementById('reset-btn').addEventListener('click',()=>{
    fromEl.value=defaultDate; toEl.value=defaultDate; render(defaultDate,defaultDate);
  });

  render(defaultDate,defaultDate);
})();
